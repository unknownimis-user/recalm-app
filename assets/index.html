<!DOCTYPE html>
<html lang="en" data-theme="aurora">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a1210">
<title>ReCalm</title>
<link rel="icon" href="data:,">
<style>
/* ============ reset & base ============ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  font-family: -apple-system, "Roboto", "Segoe UI", system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; user-select: none; -webkit-user-select: none; }
input, textarea { font: inherit; color: inherit; }
img { display: block; }
::selection { background: var(--accent-soft); }

/* ============ themes ============ */
html[data-theme="aurora"] {
  --bg:#0a1210; --surface:#101b17; --surface2:#15221d; --border:#1e2b25;
  --text:#e8f2ed; --muted:#8fa79b; --accent:#34d399; --accent2:#2dd4bf;
  --accent-soft:rgba(52,211,153,.14); --accent-glow:rgba(52,211,153,.30);
  --danger:#f87171; --danger-soft:rgba(248,113,113,.12); --gold:#fbbf24;
  --on-accent:#06251c;
}
html[data-theme="sunset"] {
  --bg:#131009; --surface:#1d1712; --surface2:#251d15; --border:#332819;
  --text:#f5ece0; --muted:#a8977f; --accent:#fb923c; --accent2:#f59e0b;
  --accent-soft:rgba(251,146,60,.14); --accent-glow:rgba(251,146,60,.30);
  --danger:#f87171; --danger-soft:rgba(248,113,113,.12); --gold:#fbbf24;
  --on-accent:#2b1503;
}
html[data-theme="lavender"] {
  --bg:#0f0d17; --surface:#181527; --surface2:#201c33; --border:#2c2745;
  --text:#ede9fa; --muted:#9d97bd; --accent:#a78bfa; --accent2:#c4b5fd;
  --accent-soft:rgba(167,139,250,.16); --accent-glow:rgba(167,139,250,.32);
  --danger:#f87171; --danger-soft:rgba(248,113,113,.12); --gold:#fbbf24;
  --on-accent:#1d1240;
}
html[data-theme="glass"] {
  --bg:#0b0e14; --surface:rgba(255,255,255,.07); --surface2:rgba(255,255,255,.11);
  --border:rgba(255,255,255,.13); --text:#f2f5fa; --muted:#a7b2c2;
  --accent:#f7fafd; --accent2:#ccd6e3;
  --accent-soft:rgba(255,255,255,.15); --accent-glow:rgba(255,255,255,.30);
  --danger:#f87171; --danger-soft:rgba(248,113,113,.13); --gold:#fbbf24;
  --on-accent:#121824;
}

/* ============ app shell ============ */
#app { height: 100dvh; display: flex; flex-direction: column; }
#hdr {
  display: flex; align-items: center; gap: 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 18px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.logo { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--on-accent); flex: none; }
.logo svg { width: 17px; height: 17px; }
#hdr .brand { font-weight: 800; font-size: 17px; letter-spacing: -0.02em; }
#hdr .spacer { flex: 1; }
.streak-chip {
  display: flex; align-items: center; gap: 5px; padding: 6px 11px; border-radius: 999px;
  background: var(--surface2); border: 1px solid var(--border); font-size: 13px; font-weight: 700;
}
.streak-chip svg { width: 14px; height: 14px; color: var(--gold); animation: flick 2.4s ease-in-out infinite; }
@keyframes flick { 0%,100% { transform: scale(1); } 50% { transform: scale(1.14) rotate(-3deg); } }
.iconbtn { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center;
  background: var(--surface2); border: 1px solid var(--border); color: var(--muted); flex: none; }
.iconbtn:active { transform: scale(.93); }
.iconbtn svg { width: 17px; height: 17px; }

#view { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 18px 18px 28px; }
#view::-webkit-scrollbar, .scroll-y::-webkit-scrollbar { width: 4px; }
#view::-webkit-scrollbar-thumb, .scroll-y::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

#tabbar {
  display: flex; border-top: 1px solid var(--border); background: var(--bg);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 9px 0 8px; color: var(--muted); position: relative;
}
.tab svg { width: 21px; height: 21px; }
.tab span { font-size: 10.5px; font-weight: 600; letter-spacing: .01em; }
.tab.active { color: var(--accent); }
.tab.active::before {
  content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 26px; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent);
}

/* ============ common components ============ */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 16px; }
.h-label { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 22px 2px 10px; }
.h-label:first-child { margin-top: 2px; }
.muted { color: var(--muted); }
.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  height: 52px; border-radius: 999px; font-weight: 700; font-size: 15.5px; width: 100%;
  transition: transform .08s ease, opacity .15s ease;
}
.btn:active { transform: scale(.97); }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--on-accent);
  box-shadow: 0 8px 26px -8px var(--accent-glow); }
.btn.soft { background: var(--accent-soft); color: var(--accent); border: 1px solid transparent; }
.btn.ghost { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.btn.sm { height: 42px; font-size: 14px; }
.btn.auto { width: auto; flex: none; padding: 0 20px; }

.chip {
  padding: 7px 13px; border-radius: 999px; font-size: 13px; font-weight: 600;
  background: var(--surface2); border: 1px solid var(--border); color: var(--muted); flex: none;
}
.chip.on { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.chip:disabled { opacity: .35; pointer-events: none; }

/* schedule day chips + time inputs */
.day-chips { display: flex; gap: 6px; margin-top: 12px; }
.day-chips .chip { flex: 1; justify-content: center; padding: 9px 0; font-weight: 800; }
input[type="time"].input { color-scheme: dark; font-weight: 700; letter-spacing: .04em; }
input[type="time"].input::-webkit-calendar-picker-indicator { opacity: .55; }
.badge-strict {
  display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px;
  background: var(--danger-soft); color: var(--danger); font-size: 10.5px; font-weight: 800; letter-spacing: .08em;
}
.badge-strict svg { width: 10px; height: 10px; }

/* switch */
.switch { width: 46px; height: 28px; border-radius: 999px; background: var(--surface2);
  border: 1px solid var(--border); position: relative; flex: none; transition: background .18s ease; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
  border-radius: 50%; background: var(--muted); transition: transform .18s ease, background .18s ease; }
.switch.on { background: var(--accent); border-color: transparent; }
.switch.on::after { transform: translateX(18px); background: var(--on-accent); }

/* stepper */
.stepper { display: flex; align-items: center; gap: 10px; }
.stepbtn { width: 38px; height: 38px; border-radius: 12px; background: var(--surface2);
  border: 1px solid var(--border); display: grid; place-items: center; font-size: 19px; font-weight: 700; color: var(--accent); }
.stepbtn:active { transform: scale(.92); }

/* segmented */
.seg { display: flex; background: var(--surface2); border: 1px solid var(--border); border-radius: 13px; padding: 3px; gap: 3px; }
.seg button { flex: 1; height: 36px; border-radius: 10px; font-size: 13px; font-weight: 700; color: var(--muted); }
.seg button.on { background: var(--accent-soft); color: var(--accent); }

/* range */
input[type="range"] { -webkit-appearance: none; width: 100%; height: 30px; background: transparent; }
input[type="range"]::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; background: var(--surface2); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
  background: var(--accent); margin-top: -8.5px; border: 3px solid var(--bg); box-shadow: 0 0 0 1px var(--border); }

/* inputs */
.input { width: 100%; height: 48px; border-radius: 14px; background: var(--surface2);
  border: 1px solid var(--border); padding: 0 14px; font-size: 15px; outline: none; }
.input::placeholder { color: var(--muted); }
.input:focus { border-color: var(--accent); }

/* progress bar */
.bar { height: 8px; border-radius: 4px; background: var(--surface2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 4px;
  background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .4s ease; }

/* ============ timer view ============ */
.timer-wrap { display: flex; flex-direction: column; align-items: center; padding-top: 10px; }
.phase-line { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; justify-content: center; }
.phase-name { font-size: 13px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.round-dots { display: flex; gap: 6px; margin-bottom: 18px; }
.rdot { width: 8px; height: 8px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--border); }
.rdot.done { background: var(--accent); border-color: transparent; }
.rdot.cur { background: var(--accent-soft); border-color: var(--accent); animation: pulse-dot 1.6s ease-in-out infinite; }
@keyframes pulse-dot { 0%,100% { transform: scale(1); } 50% { transform: scale(1.45); } }

.ring-box { position: relative; width: 268px; height: 268px; }
.ring-box svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--surface2); stroke-width: 11; }
.ring-fg { fill: none; stroke: url(#ringGrad); stroke-width: 11; stroke-linecap: round;
  filter: drop-shadow(0 0 10px var(--accent-glow)); }
.ring-box.break .ring-fg { stroke: var(--muted); filter: none; opacity: .8; }
.ring-mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
#time-txt { font-size: 54px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1; }
#time-sub { font-size: 12.5px; color: var(--muted); font-weight: 600; margin-top: 7px; }
.subject-chip { max-width: 230px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  margin-top: 14px; padding: 6px 12px; border-radius: 999px; background: var(--surface2);
  border: 1px solid var(--border); font-size: 12.5px; color: var(--muted); }

.avoid-strip { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 16px; max-width: 300px; }
.avoid-strip .chip { font-size: 11.5px; padding: 5px 10px; color: var(--danger); background: var(--danger-soft); border-color: transparent; }

.ctrl { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; margin-top: 26px; }
.dur-row { display: flex; gap: 8px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
.today-strip { width: 100%; max-width: 320px; margin-top: 26px; }
.today-strip .row { justify-content: space-between; margin-bottom: 8px; font-size: 12.5px; }

/* hold-to-give-up */
.hold-btn { position: relative; overflow: hidden; }
.hold-btn .fill { position: absolute; inset: 0; width: 0%; background: rgba(248,113,113,.28); pointer-events: none; }
.hold-btn .lbl { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 8px; }

/* ============ stats view ============ */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat-card .k { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.stat-card .v { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin-top: 6px; }
.stat-card .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
.stat-card.wide { grid-column: span 2; }
.week { display: flex; justify-content: space-between; margin-top: 14px; }
.wcol { display: flex; flex-direction: column; align-items: center; gap: 7px; width: 34px; }
.wbar { width: 100%; height: 96px; border-radius: 8px; background: var(--surface2); display: flex; align-items: flex-end; overflow: hidden; }
.wbar > i { width: 100%; border-radius: 8px; background: linear-gradient(180deg, var(--accent), var(--accent2)); min-height: 2px; }
.wcol .wl { font-size: 10.5px; font-weight: 700; color: var(--muted); }
.wcol.today .wl { color: var(--accent); }

.hist-group { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 18px 2px 8px; }
.hist-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 15px;
  background: var(--surface); border: 1px solid var(--border); margin-bottom: 8px; }
.hist-row .st { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; flex: none; }
.hist-row .st.ok { background: var(--accent-soft); color: var(--accent); }
.hist-row .st.bad { background: var(--danger-soft); color: var(--danger); }
.hist-row .st svg { width: 16px; height: 16px; }
.hist-row .t { font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist-row .d { font-size: 12px; color: var(--muted); margin-top: 2px; }
.hist-row .when { font-size: 11.5px; color: var(--muted); text-align: right; flex: none; }
.mini-badge { display: inline-block; padding: 2px 7px; border-radius: 6px; font-size: 10px; font-weight: 800;
  letter-spacing: .06em; background: var(--surface2); color: var(--muted); margin-left: 6px; vertical-align: 1px; }
.mini-badge.strict { background: var(--danger-soft); color: var(--danger); }

/* ============ guard view ============ */
.guard-hero { display: flex; gap: 14px; align-items: center; }
.guard-hero img { width: 74px; height: 74px; border-radius: 20px; flex: none; object-fit: cover; }
.guard-hero p { font-size: 13px; line-height: 1.5; color: var(--muted); }
.trap-row { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 15px;
  background: var(--surface); border: 1px solid var(--border); margin-bottom: 8px; }
.trap-row .ic { width: 34px; height: 34px; border-radius: 11px; background: var(--danger-soft);
  color: var(--danger); display: grid; place-items: center; flex: none; }
.trap-row .ic svg { width: 16px; height: 16px; }
.trap-row .t { font-weight: 700; font-size: 14px; }
.trap-row .d { font-size: 12px; color: var(--muted); margin-top: 1px; }

/* ============ settings view ============ */
.set-row { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--border); }
.set-row:last-child { border-bottom: none; }
.set-row .t { font-weight: 700; font-size: 14.5px; }
.set-row .d { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
.set-row .av { border-radius: 11px; display: grid; place-items: center; font-weight: 800; flex: none;
  background: var(--surface2); color: var(--muted); font-size: 15px; }
.swatches { display: flex; gap: 12px; }
.swatch { width: 44px; height: 44px; border-radius: 50%; border: 2.5px solid transparent; position: relative; flex: none; }
.swatch.on { border-color: var(--text); }
.swatch.on::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; border: 2px solid var(--bg); }

/* ============ app shield ============ */
.perm-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.perm-row:last-child { border-bottom: none; }
.perm-row .ic { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; flex: none;
  background: var(--surface2); color: var(--muted); }
.perm-row .ic.ok { background: var(--accent-soft); color: var(--accent); }
.perm-row .ic svg { width: 16px; height: 16px; }
.perm-row .t { font-weight: 700; font-size: 14px; }
.perm-row .d { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
.perm-grant { flex: none; padding: 9px 16px; border-radius: 999px; font-size: 13px; font-weight: 700;
  background: var(--accent-soft); color: var(--accent); }
.perm-grant:active { transform: scale(.95); }
.shield-armed { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14.5px; }
.shield-armed svg { width: 18px; height: 18px; color: var(--accent); flex: none; }
.app-row { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 15px;
  background: var(--surface); border: 1px solid var(--border); margin-bottom: 8px; }
.app-row img { width: 38px; height: 38px; border-radius: 11px; flex: none; background: var(--surface2); object-fit: cover; }
.app-row .av, .blocklog-row .av { border-radius: 11px; display: grid; place-items: center; font-weight: 800; flex: none; }
.app-row .av { width: 38px; height: 38px; background: var(--surface2); color: var(--muted); font-size: 16px; }
.app-row .t { font-weight: 700; font-size: 14px; }
.app-row .d { font-size: 11px; color: var(--muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.app-tile { position: relative; display: flex; flex-direction: column; align-items: center; gap: 7px;
  padding: 13px 4px 10px; border-radius: 15px; background: var(--surface2); border: 1.5px solid transparent; }
.app-tile:active { transform: scale(.94); }
.app-tile img { width: 40px; height: 40px; border-radius: 11px; }
.app-tile span { font-size: 10.5px; font-weight: 600; color: var(--muted); text-align: center; line-height: 1.25;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.app-tile.on { border-color: var(--accent); background: var(--accent-soft); }
.app-tile.on span { color: var(--text); }
.app-tile .tick { position: absolute; top: 6px; right: 6px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--accent); color: var(--on-accent); display: none; place-items: center; }
.app-tile.on .tick { display: grid; }
.app-tile .tick svg { width: 10px; height: 10px; }
#app-list { max-height: 46vh; overflow-y: auto; margin-top: 8px; -webkit-overflow-scrolling: touch; }
.blocklog-row { display: flex; align-items: center; gap: 10px; padding: 9px 2px; font-size: 13px; }
.blocklog-row .av { width: 30px; height: 30px; border-radius: 9px; background: var(--danger-soft);
  color: var(--danger); font-size: 13px; }
.blocklog-row .when { margin-left: auto; color: var(--muted); font-size: 11.5px; flex: none; }
.shield-chip { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; padding: 7px 14px;
  border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700; }
.shield-chip.warn { background: var(--danger-soft); color: var(--danger); }
.shield-chip svg { width: 13px; height: 13px; }

/* trusted apps (v2.8): per-app trusted / not-trusted buttons */
.trust-btn { flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-width: 106px; padding: 11px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 800;
  background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
.trust-btn svg { width: 13px; height: 13px; flex: none; }
.trust-btn.on { background: rgba(251,191,36,.13); color: var(--gold); border-color: rgba(251,191,36,.34); }
.trust-btn:active { transform: scale(.95); }
.trust-flag { font-size: 11px; font-weight: 700; color: var(--gold); }

/* ============ overlays ============ */
.overlay { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
.overlay.center { align-items: center; padding: 24px; }
.overlay .backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.62); backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px); animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; } }
.sheet { position: relative; width: 100%; max-width: 430px; background: var(--surface);
  border: 1px solid var(--border); border-bottom: none; border-radius: 26px 26px 0 0;
  padding: 10px 20px calc(env(safe-area-inset-bottom, 0px) + 20px);
  animation: slideup .26s cubic-bezier(.2,.9,.3,1.2); }
@keyframes slideup { from { transform: translateY(60%); opacity: .4; } }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--border); margin: 0 auto 16px; }
.sheet h3 { font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
.sheet .sub { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.45; }

.modal { position: relative; width: 100%; max-width: 360px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 26px; padding: 26px 22px 22px; text-align: center;
  animation: pop .3s cubic-bezier(.2,.9,.3,1.25); }
@keyframes pop { from { transform: scale(.82); opacity: 0; } }
.modal img.mascot { width: 110px; height: 110px; border-radius: 32px; margin: 0 auto 14px; object-fit: cover;
  box-shadow: 0 14px 34px -12px var(--accent-glow); }
.modal h3 { font-size: 21px; font-weight: 800; }

/* ---------- stats (IST day boundaries) ---------- */

  if (idle) {
    if (schedState().active) {
      html += '<button class="shield-chip" data-action="tab" data-v="guard">' + I.shield +

      html += '<button class="shield-chip" data-action="tab" data-v="guard">' + I.shield +

    html += '<div class="dur-row">' + [15, 25, 45, 60].map(m =>
      '<button class="chip ' + (!isBreakNext && st.focusMin === m ? 'on' : '') + '" data-action="setfocus" data-v="' + m + '">' + m + ' min</button>').join('') + '</div>';
    html += '<div class="ctrl">' +
      (isBreakNext
        ? '<button class="btn primary" data-action="startbreak">' + I.play + 'Start ' + PHASE_NAME[phase] + ' · ' + phaseMin(phase) + ' min</button>'
        : '<button class="btn primary" data-action="startfocus">' + I.play + 'Start Focus · ' + st.focusMin + ' min</button>') +
      '</div>';
    const tm = Math.round(todayMinutes());
    if (tm > 0 || S.sessions.length > 0) {
      const pct = clamp(Math.round(tm / st.dailyGoalMin * 100), 0, 100);
      html += '<div class="today-strip"><div class="row"><span class="muted" style="font-weight:600">Today</span>' +
        '<span style="font-weight:700">' + tm + ' / ' + st.dailyGoalMin + ' min</span></div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div></div>';
    } else {
      html += '<p class="muted" style="margin-top:26px;font-size:13px;text-align:center;line-height:1.6">' +
        'One completed session starts your streak.<br>Strict mode has no pause — quitting needs a<br>3-second hold, a 16-piece puzzle and is logged honestly.</p>';
    }
  } else {
    html += '<div class="ctrl">';
    if (phase !== 'focus') {
      html += '<button class="btn ghost" data-action="skipbreak">' + I.skip + 'Skip break</button>';
    } else if (t.strict) {
      html += '<button class="btn danger hold-btn" id="giveup" aria-label="Hold for 3 seconds to give up">' +
        '<span class="fill"></span><span class="lbl">' + I.flag + 'Give up — hold 3s</span></button>';
    } else {
      if (!t.paused) html += '<button class="btn ghost" data-action="pause">' + I.pause + 'Pause</button>';
      else html += '<button class="btn primary" data-action="resume">' + I.play + 'Resume</button>';
      html += '<button class="btn danger" data-action="endearly">End early</button>';
    }
    html += '</div>';
  }
  html += '<p id="zen-hint" class="muted" style="margin-top:22px;font-size:11.5px;letter-spacing:.05em">TAP ANYWHERE TO HIDE CONTROLS</p>';
  html += '</div>';
  $('#view').innerHTML = html;
  bindHold();
}
/* hold-to-give-up (3 seconds, honest) */
function bindHold() {
  const btn = $('#giveup');
  if (!btn) return;
  const fill = $('.fill', btn);
  let timer = null, start = 0;
  const stop = () => { if (timer) { cancelAnimationFrame(timer); timer = null; } fill.style.width = '0%'; };
  const step = () => {
    const p = Math.min(1, (Date.now() - start) / 3000);
    fill.style.width = (p * 100) + '%';
    if (p >= 1) { stop(); requestStrictExit(); return; }
    timer = requestAnimationFrame(step);
  };
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    start = Date.now();
    timer = requestAnimationFrame(step);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => btn.addEventListener(ev, stop));
}

  html += '<p class="h-label">Schedule blocking</p>' +

/* ---------- live timer display ---------- */
const CIRC = 2 * Math.PI * 124;
function updateTimerDisplay() {
  if (TAB !== 'timer') return;
  const elT = $('#time-txt'), elR = $('#ring-fg');
  if (!elT || !elR) return;
  const t = S.timer;
  if (!t.running) {
    elT.textContent = fmtClock(phaseMin(t.phase) * 60);
    elR.style.strokeDashoffset = '0';
    return;
  }
  const remainMs = t.paused && t.pausedAt
    ? (t.endMs - t.pausedAt)
    : (t.endMs - Date.now());
  const total = t.plannedSec * 1000;
  const remain = clamp(remainMs, 0, total);
  elT.textContent = fmtClock(remain / 1000);
  elR.style.strokeDashoffset = String(CIRC * (1 - remain / total));
  if (Date.now() >= t.endMs && !t.paused) completePhase(false);
}

/* ---------- jigsaw gate: a 4x4 picture puzzle stands between
   the 3-second hold and actually stopping a strict session ---------- */
function openPuzzle(onSolved) {
  closeOverlays();
  const IMG = 'img/mascot-zen.png';
  const pos = p => ((p % 4) / 3 * 100) + '% ' + (Math.floor(p / 4) / 3 * 100) + '%';
  const tileBg = p => 'background-image:url(' + IMG + ');background-size:400% 400%;background-position:' + pos(p);
  const placed = new Array(16).fill(-1);   /* cell -> piece id */
  const locked = new Array(16).fill(false);
  let tray = [], sel = -1;
  do {
    tray = Array.from({ length: 16 }, (_, i) => i);
    for (let i = 15; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = tray[i]; tray[i] = tray[j]; tray[j] = t; }
  } while (tray.every((p, i) => p === i));
  const html =
    '<div class="modal pz-wrap" role="dialog" aria-label="Solve the puzzle to stop the timer">' +
    '<h3>Really stopping?</h3>' +
    '<p class="muted" style="font-size:12.5px;margin-top:6px;line-height:1.5">Place all 16 pieces where they belong — only then can this session end.</p>' +
    '<div class="pz-board" id="pz-board">' +
      Array.from({ length: 16 }, (_, i) =>
        '<div class="pz-cell" data-cell="' + i + '" role="button" aria-label="puzzle slot ' + (i + 1) + '">' +
        '<i class="pz-hint" style="' + tileBg(i) + '"></i></div>').join('') +
    '</div>' +
    '<div class="pz-tray" id="pz-tray"></div>' +
    '<button class="btn ghost sm" style="margin-top:14px" data-action="dismiss">Keep focusing instead</button></div>';
  document.body.insertAdjacentHTML('beforeend', overlayHtml(html, true));
  const board = $('#pz-board'), trayEl = $('#pz-tray');
  const renderTray = () => {
    trayEl.innerHTML = tray.map(p =>
      '<div class="pz-tile' + (p === sel ? ' sel' : '') + '" data-piece="' + p + '" role="button" aria-label="puzzle piece" style="' + tileBg(p) + '"></div>').join('');
  };
  renderTray();
  const pickUp = i => {
    if (locked[i] || placed[i] < 0) return;
    tray.push(placed[i]);
    placed[i] = -1;
    const tile = board.querySelector('[data-cell="' + i + '"] .pz-tile');
    if (tile) tile.remove();
    renderTray();
  };
  const check = () => {
    if (placed.some((p, i) => !locked[i] && p < 0)) return;   /* board not full yet */
    const bad = [];
    placed.forEach((p, i) => {
      if (locked[i] || p < 0) return;
      if (p === i) { locked[i] = true; board.querySelector('[data-cell="' + i + '"]').classList.add('locked'); }
      else bad.push(i);
    });
    if (!bad.length) {   /* solved — the session can now be stopped */
      document.querySelector('.pz-wrap').classList.add('pz-done');
      trayEl.innerHTML = '<span style="font-size:12px;font-weight:700;color:var(--accent)">Solved — stopping the timer…</span>';
      Bridge.vibrate(160);
      setTimeout(() => { closeOverlays(); onSolved(); }, 650);
      return;
    }
    Bridge.vibrate(70);
    bad.forEach(i => {
      const cell = board.querySelector('[data-cell="' + i + '"]');
      cell.classList.add('bad');
      setTimeout(() => { cell.classList.remove('bad'); pickUp(i); }, 340);
    });
  };
  trayEl.addEventListener('click', e => {
    const t = e.target.closest('.pz-tile');
    if (!t) return;
    const p = +t.dataset.piece;
    sel = sel === p ? -1 : p;
    renderTray();
  });
  board.addEventListener('click', e => {
    const cell = e.target.closest('.pz-cell');
    if (!cell) return;
    const i = +cell.dataset.cell;
    if (locked[i]) return;
    if (placed[i] >= 0) { pickUp(i); return; }   /* tap a placed piece to take it back */
    if (sel < 0) return;
    const p = sel;
    sel = -1;
    tray = tray.filter(x => x !== p);
    placed[i] = p;
    cell.insertAdjacentHTML('beforeend', '<div class="pz-tile" style="' + tileBg(p) + '"></div>');
    renderTray();
    check();
  });
}

/* ---------- toast & confetti ---------- */
let toastTimer = null;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);

function confetti() {
  const cvs = document.createElement('canvas');
  cvs.id = 'confetti';
  document.body.appendChild(cvs);
  const ctx = cvs.getContext('2d');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cvs.width = innerWidth * dpr; cvs.height = innerHeight * dpr;
  ctx.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const colors = [cs.getPropertyValue('--accent'), cs.getPropertyValue('--accent2'), '#fbbf24', '#ffffff'];
  const ps = [];
  for (let i = 0; i < 130; i++) {
    ps.push({
      x: innerWidth / 2 + (Math.random() - 0.5) * 140,
      y: innerHeight * 0.32 + (Math.random() - 0.5) * 60,
      vx: (Math.random() - 0.5) * 11,
      vy: -Math.random() * 10 - 3,
      w: 5 + Math.random() * 6, h: 4 + Math.random() * 5,
      r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3,
      c: colors[i % colors.length].trim(),
    });
  }
  const t0 = performance.now();
  (function frame(now) {
    const t = (now - t0) / 1000;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    let alive = false;
    for (const p of ps) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.22; p.vx *= 0.99; p.r += p.vr;
      const a = clamp(1 - (t - 2) / 0.8, 0, 1);
      if (a > 0 && p.y < innerHeight + 30) {
        alive = true;
        ctx.save(); ctx.globalAlpha = a; ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
      }
    }
    if (alive && t < 3.2) requestAnimationFrame(frame);
    else cvs.remove();
  })(t0);
}

    if (!pkg) return;
    const i = S.trusted.indexOf(pkg);
    if (i >= 0) S.trusted.splice(i, 1); else S.trusted.push(pkg);
    save(); syncTrusted();
    const info = Shield.appInfo(pkg);
    const name = (info && info.n) || 'App';
    const list = $('#app-list');
    if (list) renderAppList($('#app-search') ? $('#app-search').value : '');
    else if (TAB === 'guard') renderView();
    const cnt = $('#pick-count');
    if (cnt) cnt.textContent = String(S.trusted.length);
    toast(S.trusted.indexOf(pkg) >= 0
      ? name + ' trusted — shields go silent in it'
      : name + ' not trusted — shields active again');
  },
  untrust: el => {
    const pkg = el.dataset.p;
    if (!pkg) return;
    S.trusted = S.trusted.filter(p => p !== pkg);
    save(); syncTrusted(); renderView();
    const info = Shield.appInfo(pkg);
    toast(((info && info.n) || 'App') + ' not trusted — shields active in it again');
  },
  limitapp: el => openLimitSheet(el.dataset.p),
  setlimit: el => {
    const pkg = el.dataset.p, min = +el.dataset.min || 0;
    const info = Shield.appInfo(pkg);
    if (min > 0) { S.limits[pkg] = min; toast((info ? info.n : 'App') + ' capped at ' + min + ' min/day'); }
    else { delete S.limits[pkg]; toast('Limit removed'); }
    save(); syncLimits();
    const ov = $$('.overlay');
    if (ov.length) {
      ov[ov.length - 1].remove();
      if ($('#app-list')) renderAppList($('#app-search') ? $('#app-search').value : '');
      else if (TAB === 'guard') renderView();
    } else if (TAB === 'guard') renderView();
  },
  dismissTop: () => { const ov = $$('.overlay'); if (ov.length) ov[ov.length - 1].remove(); },
  pinset: () => openSetPinSheet(),
  pinchange: () => openPinSheet('Current PIN', 'Enter your current PIN to change it.', openSetPinSheet),
  pinremove: () => openPinSheet('Current PIN', 'Enter your current PIN to remove the lock.', () => {
    S.settings.pinHash = ''; save(); renderView(); toast('PIN removed');
  }),
  addtrap: () => {
    const inp = $('#trap-label');
    const v = ((inp && inp.value) || '').trim();
    if (!v) { toast('Give it a name first'); return; }
    S.blocklist.unshift({ id: uid(), label: v, createdAt: Date.now() });
    save(); renderView(); toast('Trap added — it will show during focus');
  },
  deltrap: el => {
    S.blocklist = S.blocklist.filter(b => b.id !== el.dataset.id);
    save(); renderView(); toast('Removed');
  },
  export: () => {
    const payload = JSON.stringify({
      app: 'ReCalm', version: 1, exportedAt: new Date().toISOString(),
      settings: S.settings, sessions: S.sessions, blocklist: S.blocklist, blockedApps: S.blockedApps,
      schedule: S.schedule, pauses: S.pauses, quick: S.quick, limits: S.limits, reelsOnly: S.reelsOnly,
      trusted: S.trusted,
    }, null, 2);
    if (Bridge.exportData(payload)) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([payload], { type: 'application/json' }));
    a.download = 'recalm-backup.json';
    document.body.appendChild(a); a.click(); a.remove();
    toast('Backup downloaded');
  },
  reset1: () => openResetSheet(),
  reset2: () => {
    clearInterval(autoTimer); autoTimer = null;
    closeOverlays();
    Sound.stopAmb(); releaseWake(); Bridge.cancelNotify();
    try { localStorage.removeItem(KEY); } catch (e) {}
    Bridge.clearBlockLog(); Shield.entries = []; Shield.count = 0;
    load();
    document.documentElement.dataset.theme = S.settings.theme;
    Bridge.setTheme(S.settings.theme);
    Sound.setVolume(S.settings.volume);
    syncShield();
    renderAll();
    toast('Everything reset');
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.action];
  if (fn) fn(el, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'app-search') { renderAppList(el.value); return; }
  if (el.id === 'sess-note') { /* v2.6: jot it onto the finished session */
    const last = S.sessions[S.sessions.length - 1];
    if (last && last.type === 'focus') { last.note = el.value.trim(); save(); }
    return;
  }
  if (el.id === 'sched-start' || el.id === 'sched-end') return; /* committed via change */
  if (el.dataset && el.dataset.input === 'volume') {
    S.settings.volume = +el.value;
    save(); Sound.setVolume(S.settings.volume);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (document.body.classList.contains('zen')) exitZen(); else { closeOverlays(); renderView(); } }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'sched-start' || el.id === 'sched-end') {
    const k = el.id === 'sched-start' ? 'start' : 'end';
    if (el.value) S.schedule[k] = el.value;
    save(); syncShield();
    if (TAB === 'guard') renderView();
  }
});
/* first gesture unlocks audio everywhere */
document.addEventListener('pointerdown', () => Sound.unlock(), { once: true, capture: true });

/* zen: tap main area toggles controls; dedicated button leaves */
document.addEventListener('click', e => {
  if (!document.body.classList.contains('zen')) return;
  if (e.target.closest('#zen-exit') || e.target.closest('.overlay')) return;
  document.body.classList.toggle('zenui-hide');
});

/* android hardware back */
window.__androidBack = function () {
  if (document.body.classList.contains('zen')) { exitZen(); return true; }
  if ($('.overlay')) { ACTIONS.dismiss(); return true; }
  if (TAB !== 'timer') { TAB = 'timer'; renderAll(); return true; }
  return false;
};

/* visibility: pause rain when hidden, re-reconcile on return */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { Sound.stopAmb(); }
  else {
    reconcile();
    if (Bridge.ok) { Shield.refreshPerms(); Shield.loadLog(); Shield.loadState(); syncShield(); }
    if (TAB === 'guard') renderView();
    const t = S.timer;
    if (t && t.running && !t.paused && t.phase === 'focus' && ambOn()) Sound.startAmb();
    if (t && t.running && !t.paused && S.settings.keepAwake) acquireWake();
    updateTimerDisplay();
  }
});

/* ---------- boot ---------- */
load();
document.documentElement.dataset.theme = S.settings.theme;
Bridge.setTheme(S.settings.theme);
if (Bridge.ok) {
  Shield.refreshPerms(); Shield.loadLog(); Shield.loadState();
  /* the native trusted list is what the shields obey — reconcile to it */
  const tr = Bridge.getTrustedApps();
  if (tr) { try { const a = JSON.parse(tr); if (Array.isArray(a)) S.trusted = a.filter(x => typeof x === 'string'); } catch (e) {} }
}
else Shield.loadApps(); /* web preview: demo list for the pickers */
reconcile();
syncShield();
renderAll();
let lastPauseSec = -1, lastQuickSec = -1;
(function loop() {
  if (!document.hidden) {
    updateTimerDisplay();
    const pl = $('#pause-left');
    if (pl) {
      const sec = Math.max(0, Math.round(((S.pauseUntil || 0) - Date.now()) / 1000));
      if (sec !== lastPauseSec) {
        lastPauseSec = sec;
        pl.textContent = fmtClock(sec);
        if (sec === 0 && S.pauseUntil) { S.pauseUntil = 0; if (TAB === 'guard') renderView(); }
      }
    }
    const ql = $('#quick-left');
    if (ql) {
      const qsec = Math.max(0, Math.round(((S.quick.until || 0) - Date.now()) / 1000));
      if (qsec !== lastQuickSec) {
        lastQuickSec = qsec;
        ql.textContent = fmtClock(qsec);
        if (qsec === 0 && S.quick.until) { S.quick.until = 0; save(); renderView(); }
      }
    }
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
